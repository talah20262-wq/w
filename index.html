<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Inbox Pro | الملكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg: #000000; --header: #121212; --accent: #fe2c55; --text: #ffffff; --gray: #8a8a8e; --online: #25d366; }
        body, html { height: 100%; margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        
        /* شاشات */
        .page { display: none; height: 100vh; flex-direction: column; }
        .active { display: flex; }

        /* تسجيل الدخول */
        .auth-screen { background: var(--bg); justify-content: center; align-items: center; text-align: center; }
        .auth-card { width: 85%; max-width: 380px; padding: 30px; background: var(--header); border-radius: 25px; border: 1px solid #222; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: none; background: #262626; color: white; text-align: center; outline: none; }
        .btn-main { background: var(--accent); color: white; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }

        /* الواجهة الرئيسية (Inbox) */
        .top-bar { padding: 15px 20px; background: var(--bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 0.1px solid #333; }
        .active-bar { display: flex; gap: 15px; padding: 15px; overflow-x: auto; border-bottom: 0.1px solid #333; }
        .user-circle { min-width: 60px; text-align: center; font-size: 11px; }
        .avatar-wrap { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--accent); padding: 2px; position: relative; margin-bottom: 5px; }
        .avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; background: #333; }
        .dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: var(--online); border: 2px solid black; border-radius: 50%; }

        /* قائمة المحادثات */
        .inbox-list { flex: 1; overflow-y: auto; }
        .chat-row { display: flex; align-items: center; padding: 12px 20px; gap: 15px; cursor: pointer; }
        .chat-row:active { background: #121212; }
        .row-info { flex: 1; border-bottom: 0.1px solid #222; padding-bottom: 12px; }
        .row-info b { display: block; font-size: 15px; }
        .row-info p { margin: 0; font-size: 13px; color: var(--gray); margin-top: 4px; }

        /* نافذة الشات */
        #chat-window { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .chat-header { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 0.1px solid #333; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .bubble.me { align-self: flex-end; background: #007aff; color: white; }
        .bubble.other { align-self: flex-start; background: #26262b; color: white; }
        
        .chat-input-area { padding: 10px 15px; display: flex; align-items: center; gap: 12px; background: var(--bg); }
        .input-box { flex: 1; background: #1c1c1e; border-radius: 25px; padding: 10px 15px; display: flex; align-items: center; }
        .input-box input { background: transparent; text-align: right; margin: 0; padding: 0; font-size: 15px; }

        /* لوحة المالك الملكية */
        #admin-panel { position: fixed; bottom: 0; width: 100%; background: #121212; border-top: 2px solid var(--accent); max-height: 50vh; overflow-y: auto; z-index: 3000; display: none; padding: 20px; }
        .admin-row { display: flex; justify-content: space-between; padding: 10px; background: #1c1c1e; margin-bottom: 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="page-auth" class="page auth-screen active">
        <div class="auth-card">
            <h1 style="color:var(--accent); font-size: 28px;">Star Inbox</h1>
            <p style="color:var(--gray)">منصة المراسلة الملكية</p>
            <input type="text" id="reg-name" placeholder="الاسم">
            <input type="text" id="reg-phone" placeholder="رقم الهاتف">
            <input type="password" id="reg-pass" placeholder="كلمة السر">
            <button class="btn-main" onclick="register()">دخول سريع</button>
            <button style="background:none; border:none; color:var(--gray); margin-top:20px; cursor:pointer;" onclick="adminGate()">دخول المالك 👑</button>
        </div>
    </div>

    <div id="page-main" class="page">
        <div class="top-bar">
            <i class="fas fa-bars"></i>
            <b id="display-name">Star Inbox</b>
            <i class="fas fa-crown" id="admin-icon" style="display:none; color:var(--accent)" onclick="toggleAdmin()"></i>
            <i class="fas fa-sign-out-alt" onclick="logout()"></i>
        </div>

        <div class="active-bar" id="active-list">
            <div class="user-circle">
                <div class="avatar-wrap"><img src="https://via.placeholder.com/100"><div class="dot"></div></div>
                <span>أنت</span>
            </div>
        </div>

        <div class="inbox-list">
            <div class="chat-row" onclick="openChat('ai_bot', 'Star Gemini AI')">
                <div class="avatar-wrap" style="border-color:#34b7f1"><img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png"></div>
                <div class="row-info">
                    <b>Star Gemini AI <i class="fas fa-check-circle" style="color:#34b7f1"></i></b>
                    <p id="ai-status">نشط الآن.. كيف يمكنني مساعدتك؟</p>
                </div>
            </div>
            <div id="contacts-target"></div>
        </div>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <i class="fas fa-chevron-right" onclick="closeChat()"></i>
            <b id="chat-title">الاسم</b>
        </div>
        <div class="chat-body" id="chat-feed"></div>
        <div class="chat-input-area">
            <div class="input-box">
                <input type="text" id="msg-input" placeholder="إرسال رسالة...">
                <i class="far fa-smile"></i>
            </div>
            <button onclick="sendMsg()" style="background:var(--accent); color:white; border:none; width:40px; height:40px; border-radius:50%"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="admin-panel">
        <h3 style="color:var(--accent)">لوحة تحكم الملك 👑</h3>
        <div id="admin-users"></div>
    </div>

<script>
    // 1. Firebase Config
    const fbCfg = { databaseURL: "https://groop-27edc-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(fbCfg);
    const db = firebase.database();

    // 2. Encrypted API Key
    const _E = "QUl6YVN5Ql95enRIOHExdmV3M3ZsekxqLW50eFhNMkxONHRacmJF";
    const _K = atob(_E);

    let me = JSON.parse(localStorage.getItem('star_session')), curPath = "";

    if(me) start();

    function register() {
        const n=document.getElementById('reg-name').value, p=document.getElementById('reg-phone').value, s=document.getElementById('reg-pass').value;
        if(!n||!p||!s) return;
        const d = { name:n, phone:p, pass:s, role:'user' };
        db.ref('users/'+p).set(d).then(() => { localStorage.setItem('star_session', JSON.stringify(d)); location.reload(); });
    }

    function adminGate() {
        Swal.fire({ title: 'باسورد المالك', input: 'password' }).then(r => {
            if(r.value === "2009257mama") {
                const d = { name:'المالك النجم 👑', phone:'admin', role:'admin' };
                localStorage.setItem('star_session', JSON.stringify(d)); location.reload();
            }
        });
    }

    function start() {
        document.getElementById('page-auth').classList.remove('active');
        document.getElementById('page-main').classList.add('active');
        document.getElementById('display-name').innerText = me.name;
        
        if(me.role === 'admin') {
            document.getElementById('admin-icon').style.display = 'block';
            loadAdmin();
        }

        db.ref('users').on('value', snap => {
            const list = document.getElementById('contacts-target');
            const activeBar = document.getElementById('active-list');
            list.innerHTML = "";
            snap.forEach(u => {
                if(u.val().phone !== me.phone) {
                    const path = [me.phone, u.val().phone].sort().join('_');
                    list.innerHTML += `<div class="chat-row" onclick="openChat('${path}', '${u.val().name}')">
                        <div class="avatar-wrap"><img src="https://via.placeholder.com/100"></div>
                        <div class="row-info"><b>${u.val().name}</b><p>اضغط لبدء المراسلة الملكية...</p></div>
                    </div>`;
                }
            });
        });
    }

    function openChat(p, n) {
        curPath = p; document.getElementById('chat-title').innerText = n;
        document.getElementById('chat-window').style.display = 'flex';
        db.ref('msgs/'+p).on('value', s => {
            const f = document.getElementById('chat-feed'); f.innerHTML = "";
            s.forEach(m => { f.innerHTML += `<div class="bubble ${m.val().n===me.name?'me':'other'}">${m.val().b}</div>`; });
            f.scrollTop = f.scrollHeight;
        });
    }

    async function sendMsg() {
        const i = document.getElementById('msg-input'); if(!i.value) return;
        const v = i.value; db.ref('msgs/'+curPath).push({ n:me.name, b:v }); i.value = "";
        if(curPath === 'ai_bot') {
            document.getElementById('ai-status').innerText = "جاري التفكير...";
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${_K}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: v }] }] })
                });
                const d = await r.json();
                db.ref('msgs/ai_bot').push({ n:'Star Gemini AI', b: d.candidates[0].content.parts[0].text });
            } catch(e) { db.ref('msgs/ai_bot').push({ n:'Star Gemini AI', b: 'عذراً يا ملك، فيه مشكلة في الاتصال.' }); }
            document.getElementById('ai-status').innerText = "نشط الآن.. كيف يمكنني مساعدتك؟";
        }
    }

    function loadAdmin() {
        db.ref('users').on('value', snap => {
            const a = document.getElementById('admin-users'); a.innerHTML = "";
            snap.forEach(u => {
                if(u.val().role !== 'admin') {
                    a.innerHTML += `<div class="admin-row">
                        <span>${u.val().name}</span>
                        <button onclick="db.ref('users/${u.key}').remove()" style="background:red; color:white; border:none; border-radius:5px; padding:5px">حذف</button>
                    </div>`;
                }
            });
        });
    }

    function toggleAdmin() { const p=document.getElementById('admin-panel'); p.style.display=p.style.display==='block'?'none':'block'; }
    function closeChat() { document.getElementById('chat-window').style.display = 'none'; }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
